cache_path: /villa/huangyt24-srt/FlameDiff/dataset/H2_Tco_jet_flames_3fields/9cases_slice_5_200_192_256
exp_name: vit
log_dir: /villa/huangyt24-srt/FlameDiff/exp/${exp_name}/${now:%Y-%m-%d-%H-%M-%S}
endecoder_ckpt: /villa/huangyt24-srt/FlameDiff/weights/EnDecoder_new.ckpt
# ckpt_path: only used to resume FlameAgent training; point to a local flame-*.ckpt when needed
seed: 0

sensors: [[20, 95], [70, 95], [110, 80], [110, 110], [160, 75], [160, 120], [200, 75], [200, 120]]

flame_agent:
  params:
    endecoder_ckpt: ${endecoder_ckpt}
    sensors: ${sensors}
    # ckpt_path: ${ckpt_path}
    
trainer:
  max_epochs: 2000
  check_val_every_n_epoch: 50
  log_every_n_steps: 1
  strategy: ddp
  gradient_clip_val: 1.0

dataloader:
  batch_size: 32
  shuffle: True
  num_workers: 8


